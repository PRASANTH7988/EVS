name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Microplastics-Monitor.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microplastics-Monitor.apk
          path: release-apk/Microplastics-Monitor.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Microplastics Monitor Mobile APK v1.0.0"
          body: |
            ### Microplastics Monitor Android Mobile App (APK)
            Academic Environmental Science & Engineering Capstone Platform
            - **Package**: `org.evs.microplastics`
            - **Version**: `1.0.0`
            - **Download**: Click `Microplastics-Monitor.apk` below to download directly onto your Android device!
          files: release-apk/Microplastics-Monitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
