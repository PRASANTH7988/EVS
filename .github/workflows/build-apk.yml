name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x android/gradlew || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Copy Built Web Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || (tail -n 120 build.log > ../GRADLE_ERROR.txt && exit 1)

      - name: Save Diagnostic Log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-error
          git add GRADLE_ERROR.txt
          git commit -m "ci: upload gradle error trace"
          git push origin debug-error --force

      - name: Locate and Copy APK
        run: |
          mkdir -p release-apk
          find android -name "*.apk" -exec cp -v {} release-apk/Microplastics-Monitor.apk \;
          ls -lh release-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microplastics-Monitor.apk
          path: release-apk/Microplastics-Monitor.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Microplastics Monitor Mobile APK v1.0.0"
          body: |
            ### Microplastics Monitor Android Mobile App (APK)
            Academic Environmental Science & Engineering Capstone Platform
            - **Package**: `org.evs.microplastics`
            - **Version**: `1.0.0`
            - **Download**: Click `Microplastics-Monitor.apk` below to download directly onto your Android device!
          files: release-apk/Microplastics-Monitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
